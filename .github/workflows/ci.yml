name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify dist/ is up to date with src/
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of sync with src/ -- run 'npm run build' and commit the result."
            git diff dist
            exit 1
          fi
