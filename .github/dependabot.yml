version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # @actions/core@3.x and @actions/github@9.x dropped CommonJS support
      # entirely (ESM-only exports field, no "require" condition) -- ncc
      # can't bundle either at those majors, confirmed directly while
      # setting this project up. 2.0.3/8.0.1 are the last CJS-compatible
      # releases of each. Don't let Dependabot repeatedly propose a major
      # bump that's known to break the build; still get patch/minor
      # updates within the pinned major.
      - dependency-name: '@actions/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@actions/github'
        update-types: ['version-update:semver-major']
      # textconvert@3.x dropped CommonJS support the same way -- confirmed
      # directly: ncc doesn't error on the build, but the compiled import
      # resolves to a webpack "missing module" stub that throws at
      # startup. 2.16.2 is the last version with a working require
      # condition. Revisit once #33 (ESM migration) lands.
      - dependency-name: 'textconvert'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
